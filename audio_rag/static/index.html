<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio RAG – Machine Voice Assistant</title>
<style>
  :root { --bg:#0f1418; --panel:#182027; --line:#26313a; --text:#e7edf2; --muted:#8b9aa6; --accent:#3fb8af; --warn:#e8a33d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, input[type=text] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15px; }
  input[type=text] { flex:1; min-width: 220px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button:hover { border-color: var(--accent); }
  #talk { width: 100%; margin: 22px 0; padding: 26px; font-size: 18px; font-weight: 600; border-radius: 14px;
          border: 2px solid var(--accent); background: transparent; color: var(--accent); user-select:none; touch-action: none; }
  #talk.rec { background: var(--accent); color: #062421; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:14px; }
  .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  #answer { white-space: pre-wrap; line-height: 1.5; font-size: 16px; }
  .src { font-size: 13px; color: var(--muted); padding: 6px 0; border-top: 1px solid var(--line); }
  .src:first-of-type { border-top: 0; }
  .src b { color: var(--text); font-weight: 500; }
  .status { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .err { color: var(--warn); }
  .hidden { display:none; }
  details.docs { margin-top: 28px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding: 12px 18px; }
  details.docs summary { cursor:pointer; font-weight:600; padding: 4px 0; }
  .docs .row { margin-top: 12px; }
  .pick { border-style: dashed; }
  #picked, #docList { color: var(--muted); font-size: 13px; margin-top: 10px; white-space: pre-line; max-height: 160px; overflow:auto; }
  .chk { color: var(--muted); font-size: 14px; display:flex; gap:6px; align-items:center; }
  .primary { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Machine Voice Assistant</h1>
  <p class="sub">Ask a machine about itself. Answers come only from its own documentation, using a local Llama model.</p>

  <div class="row">
    <label for="machine" style="color:var(--muted);font-size:14px">Machine</label>
    <select id="machine"></select>
  </div>

  <button id="talk">Hold to talk</button>

  <form id="textForm" class="row">
    <input id="question" type="text" placeholder="…or type a question, e.g. How do I clear error E47?">
    <button type="submit">Ask</button>
  </form>
  <div id="status" class="status"></div>

  <div id="heardCard" class="card hidden"><div class="label">You asked</div><div id="heard"></div></div>
  <div id="answerCard" class="card hidden"><div class="label">Answer</div><div id="answer"></div></div>
  <div id="sourcesCard" class="card hidden"><div class="label">From the documentation</div><div id="sources"></div></div>

  <details class="docs" id="docsPanel">
    <summary>Add documents for a machine</summary>
    <div class="row">
      <input id="newMachine" type="text" placeholder="Machine name, e.g. forklift_2 or station3">
    </div>
    <div class="row">
      <button type="button" class="pick" onclick="$('folderInput').click()">Choose folder</button>
      <button type="button" class="pick" onclick="$('filesInput').click()">Choose files</button>
      <label class="chk"><input id="replaceDocs" type="checkbox"> Replace old documents</label>
    </div>
    <input id="folderInput" type="file" webkitdirectory directory multiple class="hidden">
    <input id="filesInput" type="file" multiple accept=".pdf,.docx,.md,.txt" class="hidden">
    <div id="picked">No files chosen. Supported: PDF, Word (.docx), Markdown, text.</div>
    <div class="row"><button type="button" id="uploadBtn" class="primary">Upload and learn</button></div>
    <div id="docList"></div>
  </details>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let recorder = null, chunks = [], stream = null;

function status(msg, isErr = false) { $("status").textContent = msg; $("status").className = "status" + (isErr ? " err" : ""); }

async function loadMachines(select) {
  const res = await fetch("/machines");
  const { machines } = await res.json();
  $("machine").innerHTML = machines.map(m => `<option>${esc(m)}</option>`).join("");
  if (select) $("machine").value = select;
}

function show(data) {
  $("heard").textContent = data.question;
  $("answer").textContent = data.answer;
  $("sources").innerHTML = data.sources.map(s =>
    `<div class="src"><b>${esc(s.section)}</b> · ${esc(s.file)}${s.score != null ? " · score " + s.score : ""}</div>`).join("");
  ["heardCard", "answerCard", "sourcesCard"].forEach(id => $(id).classList.remove("hidden"));
  const t = data.timing ? `Speech-to-text ${data.timing.speech_to_text}s · answer ${data.timing.answer}s` : `Answer in ${data.seconds}s`;
  status(t);
  say(data.answer);
}

async function say(text) {
  try {
    const res = await fetch("/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (res.status === 200) {
      const audio = new Audio(URL.createObjectURL(await res.blob()));
      await audio.play();
      return;
    }
  } catch (e) { /* fall back below */ }
  if ("speechSynthesis" in window) {           // no Piper voice installed: use the browser voice
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
}

async function handle(res) {
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    status(msg, true);
    return;
  }
  show(await res.json());
}

$("textForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  status("Thinking…");
  await handle(await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ machine: $("machine").value, question }) }));
});

async function startRec() {
  if (recorder) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { status("Microphone access was blocked.", true); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = sendRec;
  recorder.start();
  $("talk").classList.add("rec"); $("talk").textContent = "Listening… release to send";
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function stopRec() {
  if (!recorder) return;
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  $("talk").classList.remove("rec"); $("talk").textContent = "Hold to talk";
}

async function sendRec() {
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  recorder = null;
  if (blob.size < 2000) { status("Too short. Hold the button while you speak.", true); return; }
  const ext = (blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm");
  const form = new FormData();
  form.append("machine", $("machine").value);
  form.append("audio", blob, "question." + ext);
  status("Transcribing and thinking…");
  await handle(await fetch("/ask-audio", { method: "POST", body: form }));
}

const talk = $("talk");
talk.addEventListener("pointerdown", (e) => { e.preventDefault(); startRec(); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => talk.addEventListener(ev, stopRec));
document.addEventListener("keydown", (e) => { if (e.code === "Space" && document.activeElement.tagName !== "INPUT" && !e.repeat) { e.preventDefault(); startRec(); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement.tagName !== "INPUT") stopRec(); });

// ---------- Add documents ----------
const SUPPORTED = [".pdf", ".docx", ".md", ".txt"];
let pickedFiles = [];

function setPicked(fileList, fromFolder) {
  const all = Array.from(fileList);
  pickedFiles = all.filter(f => SUPPORTED.some(ext => f.name.toLowerCase().endsWith(ext)) || f.name === "whisper_hints.txt");
  const ignored = all.length - pickedFiles.length;
  if (fromFolder && all.length && !$("newMachine").value) {
    $("newMachine").value = (all[0].webkitRelativePath || "").split("/")[0];   // folder name = machine name
  }
  $("picked").textContent = pickedFiles.length
    ? `${pickedFiles.length} file(s) ready` + (ignored ? `, ${ignored} unsupported file(s) ignored` : "") + ":\n" +
      pickedFiles.slice(0, 12).map(f => "• " + (f.webkitRelativePath || f.name)).join("\n") + (pickedFiles.length > 12 ? "\n…" : "")
    : "No supported files found. Supported: PDF, Word (.docx), Markdown, text.";
}
$("folderInput").addEventListener("change", e => setPicked(e.target.files, true));
$("filesInput").addEventListener("change", e => setPicked(e.target.files, false));

$("uploadBtn").addEventListener("click", async () => {
  const name = $("newMachine").value.trim() || $("machine").value;
  if (!pickedFiles.length) { status("Choose a folder or files first.", true); return; }
  if (!name) { status("Give the machine a name.", true); return; }
  const form = new FormData();
  pickedFiles.forEach(f => form.append("files", f, f.webkitRelativePath || f.name));
  form.append("replace", $("replaceDocs").checked ? "true" : "false");
  $("uploadBtn").disabled = true;
  status(`Uploading ${pickedFiles.length} file(s) and building the search index…`);
  try {
    const res = await fetch(`/machines/${encodeURIComponent(name)}/documents`, { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) { status(data.detail || "Upload failed", true); return; }
    status(`Learned ${data.saved.length} file(s) for "${data.machine}" (${data.chunks} chunks, ${data.seconds}s).` +
           (data.skipped.length ? ` Skipped: ${data.skipped.join(", ")}` : ""));
    await loadMachines(data.machine);
    showDocs(data.machine);
    pickedFiles = []; $("picked").textContent = "Done. Ask your question above.";
  } catch (e) {
    status("Upload failed: " + e.message, true);
  } finally {
    $("uploadBtn").disabled = false;
  }
});

async function showDocs(machine) {
  const res = await fetch(`/machines/${encodeURIComponent(machine)}/documents`);
  if (!res.ok) { $("docList").textContent = ""; return; }
  const { documents } = await res.json();
  $("docList").textContent = `Documents for ${machine}:\n` + documents.map(d => "• " + d).join("\n");
}
$("machine").addEventListener("change", e => showDocs(e.target.value));

loadMachines().then(() => $("machine").value && showDocs($("machine").value));
</script>
</body>
</html>
